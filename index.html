<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chase Lyall</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="img/favicon.ico">
    <style>
        :root { color-scheme: light dark; --bg: #ffffff; --fg: #222222; --muted: #666666; --link: #0b62c4; }
        @media (prefers-color-scheme: dark) { :root { --bg: #16181c; --fg: #e8e8e8; --muted: #a0a0a0; --link: #6fb1ff; } }
        html, body { height: 100%; margin: 0; }
        body { display: flex; align-items: center; justify-content: center; padding: 0 16px; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
        main { max-width: 32rem; }
        h1 { font-size: 1.75rem; margin: 0 0 0.5rem; }
        p { color: var(--muted); line-height: 1.5; margin: 0 0 1rem; }
        a { color: var(--link); }
    </style>
</head>
<body>
    <main>
        <h1>Chase Lyall</h1>
        <p>This site has been retired.</p>
        <p>You can find me on <a href="https://github.com/ChaseLyall">GitHub</a> and <a href="https://www.linkedin.com/in/chaselyall">LinkedIn</a>.</p>
    </main>
</body>
</html>
